
networks:
 default:
   driver: bridge
   name: roboshop


services:
  mongodb:
    image: staymnaidu/monogdb:v1
    container_name: mongodb

  catalogue:
    image: satyamnaidu/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb

  redis:
    image: redis:7.0
    container_name: redis
  
  user:
   image: satyamnaidu/user:v1
   container_name: user
   depends_on:
   - redis
   - mongodb

  cart:
   image: satyamnaidu/cart:v1
   container_name: cart
   depends_on:
   - catalogue
   - redis

  mysql:
   image: satyamnaidu/mysql:v1
   container_name: mysql

  shipping:
   image: satyamnaidu/shipping:v1
   container_name: shippng
   depends_on:
   - mysql
   - cart

   rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123

  payment:
    image: satyamnaidu/payment:v1
    container_name: payment
    ENVIRONMENT:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_POST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - rabbitmq
    - cart
    - user


  frontend:
   image: satyamnaidu/frontend:v1
   container_name: frontend
   ports:
   - "80:80"
   depend_on:
   - catalogue
   - user
   - cart
   - shipping
   - payment
   

